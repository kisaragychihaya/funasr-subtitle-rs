# GitHub Actions CI：矩阵覆盖 x64 与 arm64（含 macOS Apple Silicon 与 Windows ARM64）
#
# 平台支持依据（已在本机实证，见仓库讨论）：
#   - ort 2.0.0-rc.15 download-binaries 提供 aarch64-apple-darwin（coreml 变体）与
#     aarch64-pc-windows-msvc（directml 变体）的 ONNX Runtime 1.31 预编译库；
#     纯 CPU 用法（不启用任何 EP 特性）下载即可用，多余 EP 运行时懒加载不影响。
#   - 全部 runner 原生编译，无交叉编译。
#
# ⚠️ windows-11-arm runner 处于 GitHub 公测，目前仅【公开仓库】免费可用；
#    私有仓库会排队不启动（需 Larger Runners 计费），届时请从矩阵中移除它。
#    参考实例：https://github.com/kisaragychihaya/pyncnn_vulkan_build

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']   # 注意：push 里写了 branches 就必须显式列 tags，否则 tag 推送不触发
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 代码质量门：fmt + clippy（一个平台即可，行为与平台无关）
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # 全平台测试 + release 构建产物
  test:
    name: test + build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest          # Linux x64
          - windows-latest         # Windows x64
          - macos-15               # macOS arm64（Apple Silicon，原生）
          - ubuntu-24.04-arm       # Linux arm64（原生，附带验证）
          - windows-11-arm         # Windows arm64（原生；公测，仅公开仓库免费）
    runs-on: ${{ matrix.os }}
    env:
      # ort 的 macOS arm64 预编译库按 macOS 13.4 构建（且 ObjC 代码引用
      # __isPlatformVersionAtLeast）：部署目标低于 13.4 时 release(LTO) 链接会炸符号。
      # 产物因此要求 macOS 13.4+（Apple Silicon 机器实际都 ≥14，无实际影响）。
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # windows-11-arm 镜像既不带 ffmpeg 也不带 winget。arm64 版 ffmpeg 用社区构建
      # tordona/ffmpeg-win-arm64（gyan.dev 无 arm64 构建、直链还会被反爬拦，做法对齐
      # ffgui 项目）：GitHub API 取最新 release 的 full-static 包 → curl 下载 →
      # 7z/tar 解压。任何失败只告警不阻断——测试步骤会跳过 test_decode 其余照跑。
      - name: 下载 ARM64 版 ffmpeg（tordona/ffmpeg-win-arm64，对齐 ffgui 做法）
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Have-Ffmpeg { [bool](Get-Command ffmpeg -ErrorAction SilentlyContinue) }
          if (Have-Ffmpeg) { ffmpeg -version | Select-Object -First 1; exit 0 }
          try {
            $headers = @{ Authorization = 'Bearer ${{ secrets.GITHUB_TOKEN }}' }
            $rel = Invoke-RestMethod 'https://api.github.com/repos/tordona/ffmpeg-win-arm64/releases/latest' -Headers $headers
            if ($rel.message) { throw "GitHub API 返回错误：$($rel.message)" }
            $asset = $rel.assets | Where-Object { $_.name -match 'full-static-win-arm64\.7z$' } | Select-Object -First 1
            if (-not $asset) { throw 'ffmpeg-win-arm64 最新 release 中未找到 full-static-win-arm64.7z' }
            Write-Host "下载 $($asset.name)"
            $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg-arm64-extract'
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $tmp | Out-Null
            curl.exe -L --fail -o "$tmp\ffmpeg.7z" $asset.browser_download_url
            if ($LASTEXITCODE -ne 0) { throw '下载 ffmpeg arm64 包失败' }
            # 优先 7z；没有则试系统自带的 tar（bsdtar 可读 7z）
            $extracted = $false
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z x "$tmp\ffmpeg.7z" -o"$tmp" | Out-Null
              if ($LASTEXITCODE -eq 0) { $extracted = $true }
            }
            if (-not $extracted) {
              tar -xf "$tmp\ffmpeg.7z" -C "$tmp"
              if ($LASTEXITCODE -eq 0) { $extracted = $true }
            }
            if (-not $extracted) { throw '7z/tar 均无法解压 ffmpeg 包' }
            $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe -Path $tmp |
              Where-Object { $_.FullName -like '*bin*' } | Select-Object -First 1
            if (-not $exe) { throw '压缩包中未找到 bin/ffmpeg.exe' }
            $bin = $exe.DirectoryName
            echo "$bin" >> $env:GITHUB_PATH; $env:PATH += ";$bin"
          } catch {
            Write-Host "::warning::ffmpeg arm64 获取失败：$($_.Exception.Message)"
          }
          if (Have-Ffmpeg) { Write-Host "ffmpeg OK"; ffmpeg -version | Select-Object -First 1 }
          else { Write-Host "::warning::ffmpeg 最终不可用，cargo test 将跳过 test_decode" }
          exit 0

      # 非 ignored 测试套件：golden 对齐 + 纯逻辑，不依赖大模型下载
      # （test_vad 只会拉 ~500KB 的 VAD 模型到临时目录）
      - name: cargo test
        shell: bash
        run: |
          set -e
          if command -v ffmpeg >/dev/null 2>&1; then
            cargo test --locked
          else
            echo "::warning::ffmpeg 不可用，跳过 test_decode（其余测试照跑）"
            cargo test --locked \
              --test test_segmentation --test test_export --test test_frontend \
              --test test_models --test test_punc --test test_vad \
              --test test_sensevoice --test test_paraformer --test test_pipeline \
              --test test_ort_shared
          fi

      # release 是 fat LTO：会把 ORT 里 CoreML 相关 ObjC 对象一并拉进链接，
      # 它们引用 compiler-rt 的 ___isPlatformVersionAtLeast（仅 CoreML EP 运行时路径
      # 才会执行到；我们纯 CPU 用不到，但链接期必须能解析）。debug 链接因按需取 .o 不受影响。
      - name: macOS 链接 compiler-rt（ort CoreML 对象）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          RT=$(ls /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/*/lib/darwin/libclang_rt.osx.a 2>/dev/null | head -n1)
          if [ -z "$RT" ]; then echo "::error::找不到 libclang_rt.osx.a"; exit 1; fi
          echo "RUSTFLAGS=-C link-arg=$RT" >> "$GITHUB_ENV"
          echo "link-arg=$RT"

      - name: release 构建
        run: cargo build --release --locked

      - name: 上传 release 产物
        uses: actions/upload-artifact@v4
        with:
          name: funasr-subtitle-rs-${{ matrix.os }}
          path: |
            target/release/funasr-subtitle-rs
            target/release/funasr-subtitle-rs.exe
          if-no-files-found: ignore

  # 真实模型 golden 端到端对拍（1.7GB 模型下载，手动触发；模型目录做缓存）
  golden-real:
    name: 真实模型 golden 对拍 (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      FUNASR_SUBTITLE_MODELS_ROOT: ${{ github.workspace }}/.models
      # 同 test job：macOS 链接需要 ≥13.4 部署目标
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 缓存模型目录
        uses: actions/cache@v4
        with:
          path: .models
          key: models-v1-${{ hashFiles('src/models/mod.rs') }}
          restore-keys: models-v1-
      - name: 真实模型对拍（含 #[ignore]）
        run: cargo test --locked -- --include-ignored --test-threads=1


  # 打 tag（v*）时发布 Release：五平台 release 构建 + 打包 + 建 Release（产物同名附加平台 triple）。
  # 依赖 check/test 先绿，保证发出去的包过得了 golden 门禁。
  release:
    name: 发布 ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # 与 test job 一致：ort 的 macOS arm64 预编译库按 macOS 13.4 构建
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # release(LTO) 链接需要 compiler-rt（同 test job 的说明）
      - name: macOS 链接 compiler-rt（ort CoreML 对象）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          RT=$(ls /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/*/lib/darwin/libclang_rt.osx.a 2>/dev/null | head -n1)
          if [ -z "$RT" ]; then echo "::error::找不到 libclang_rt.osx.a"; exit 1; fi
          echo "RUSTFLAGS=-C link-arg=$RT" >> "$GITHUB_ENV"

      - name: release 构建
        run: cargo build --release --locked

      # 打包：Windows 出 zip，其余 tar.gz；附带 README 与 LICENSE
      - name: 打包产物
        shell: bash
        run: |
          set -e
          NAME="funasr-subtitle-rs-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="target/release/funasr-subtitle-rs.exe"
          else
            EXE="target/release/funasr-subtitle-rs"
          fi
          cp "$EXE" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$NAME' -DestinationPath '$NAME.zip'"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          ls -lh dist 2>/dev/null || ls -lh .
        working-directory: .

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
